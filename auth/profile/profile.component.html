<!-- Container Row Centered -->
<br />
<div nz-row [nzJustify]="'center'" [nzAlign]="'middle'">
  <!-- Responsive Column Layout -->
  <div nz-col nzXs="22" nzSm="22" nzMd="22" nzLg="18" nzXL="22">
    <nz-card>

    <nz-spin [nzSpinning]="isuploading">
      <nz-upload
        [nzBeforeUpload]="beforeUpload"
        nzListType="picture"
        [(nzFileList)]="fileList"
        [nzLimit]="1"
        [nzSize]="50000"
        [nzFileType]="'image/png,image/jpeg,image/gif,image/bmp'"
        [nzShowUploadList]="{ showPreviewIcon: true, showRemoveIcon: true }">

        <nz-avatar
          [nz-tooltip]="'Click to change'"
          [nzSrc]="image_url || auth.user?.image || ('https://ui-avatars.com/api/?background=random&color=fff&name=' + (auth.user?.name || '') + '+' + (auth.user?.surname || ''))"
          [nzSize]="100">
        </nz-avatar>

        </nz-upload>
        <div class="delete-button-container" *ngIf="image_url || auth.user?.image">
          <button
            nz-button
            nzType="link"
            nzDanger
            nzSize="small"
            (click)="deleteProfilePicture()"
            [nzLoading]="isDeleting"
            class="delete-profile-pic-btn">
            <i nz-icon nzType="delete"></i> Remove Profile Picture
          </button>
        </div>
      </nz-spin>

      <nz-divider></nz-divider>
      <br />

      <!-- CUSTOMER FORM ONLY (existing customer) -->
      <nz-spin [nzSpinning]="isLoading">
        <form nz-form [formGroup]="customerForm" *ngIf="auth.user && ((auth.user.role_id ?? 0) === 6)">
          <nz-divider nzText="Personal Details"></nz-divider>

          <div nz-row [nzJustify]="'center'" [nzAlign]="'middle'" [nzGutter]="[24,24]">
            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Name</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Name" [nzValidateStatus]="customerForm.controls['name']">
                  <nz-input-group nzPrefixIcon="user">
                    <input type="text" nz-input formControlName="name" placeholder="Name" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Surname</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Surname" [nzValidateStatus]="customerForm.controls['surname']">
                  <nz-input-group nzPrefixIcon="user">
                    <input type="text" nz-input formControlName="surname" placeholder="Surname" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <div nz-row [nzJustify]="'center'" [nzAlign]="'middle'" [nzGutter]="[24,24]">
            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Email</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Email" [nzValidateStatus]="customerForm.controls['email']">
                  <nz-input-group nzPrefixIcon="mail">
                    <input type="text" readonly nz-input formControlName="email" placeholder="Email" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Phone</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Phone" [nzValidateStatus]="customerForm.controls['phone']">
                  <nz-input-group nzPrefixIcon="phone">
                    <input type="text" readonly nz-input formControlName="phone" placeholder="Phone" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <nz-divider nzText="Company Details"></nz-divider>

          <div nz-row [nzJustify]="'center'" [nzAlign]="'middle'" [nzGutter]="[24,24]">
            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Company Name</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Company Name" [nzValidateStatus]="customerForm.controls['companyName']">
                  <nz-input-group nzPrefixIcon="apartment">
                    <input type="text" nz-input formControlName="companyName" placeholder="Company Name" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Telephone</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Telephone" [nzValidateStatus]="customerForm.controls['telephone']">
                  <nz-input-group nzPrefixIcon="phone">
                    <input type="text" nz-input formControlName="telephone" placeholder="Telephone" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>Registration No</nz-form-label>
                <nz-form-control
                  [nzValidateStatus]="customerForm.controls['registrationNumber']"
                  nzErrorTip="Format must be YYYY/NNNNNN/XX (e.g. 2024/123456/07)">
                  <nz-input-group nzPrefixIcon="number">
                    <input
                      type="text"
                      nz-input
                      formControlName="registrationNumber"
                      placeholder="YYYY/NNNNNN/XX"
                      (input)="onRegNoInput($event)" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzXs="22" nzSm="22" nzMd="12">
              <nz-form-item>
                <nz-form-label>VAT No</nz-form-label>
                <nz-form-control
                  [nzValidateStatus]="customerForm.controls['vatNumber']"
                  nzErrorTip="VAT number must be exactly 10 digits">
                  <nz-input-group nzPrefixIcon="file-text">
                    <input
                      type="text"
                      nz-input
                      formControlName="vatNumber"
                      placeholder="10-digit VAT number"
                      (input)="onVatInput($event)" />
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label>Address</nz-form-label>
                <nz-form-control nzErrorTip="Please input your Address" [nzValidateStatus]="customerForm.controls['address']">
                  <nz-input-group nzPrefixIcon="home">
                    <textarea nz-input formControlName="address" placeholder="Address" rows="2"></textarea>
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <!-- Actions -->
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top: 8px;">
            <button
              *ngIf="auth.user?.role_id === 6"
              nz-button
              nzType="default"
              nzShape="round"
              (click)="goBack()">
              <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
              Back to Dashboard
            </button>

            <button
              type="button"
              [disabled]="!customerForm.valid"
              [nzLoading]="btnLoading"
              nz-button
              class="login-form-button login-form-margin"
              nzType="primary"
              (click)="submitForm()">
              Save
            </button>
        </div>
        </form>
      </nz-spin>

    </nz-card>
  </div>
</div>
