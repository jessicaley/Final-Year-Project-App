<div nz-row [nzJustify]="'center'">
  <div nz-col [nzSpan]="22" style="text-align: start;">
    <h1><b>Help Center</b></h1>
  </div>
</div>

<div nz-row [nzJustify]="'center'">
  <div nz-col nzSpan="22">
    <nz-collapse>
      <!-- Help PDF Panel -->
      <nz-collapse-panel
        [nzHeader]="panels[0].name"
        [nzActive]="panels[0].active"
        [nzDisabled]="panels[0].disabled"
        [nzExtra]="pdfExtra"
      >
        <div class="panel-content">
          <nz-alert nzType="info" nzMessage="PDF Resources"
                    nzDescription="Download helpful PDF guides and documentation"
                    nzShowIcon></nz-alert>
          <br>
          <div class="download-section">
            <a
              nz-button
              nzType="primary"
              href="assets/AdminHelp.pdf"
              download="AdminHelp.pdf"
            >
              <span nz-icon nzType="file-pdf" nzTheme="outline"></span>
              Download User Guide
            </a>
          </div>
        </div>
        <ng-template #pdfExtra>
          <span nz-icon [nzType]="panels[0].icon" nzTheme="outline"></span>
        </ng-template>
      </nz-collapse-panel>

      <!-- Help Video Panel -->
      <nz-collapse-panel
        [nzHeader]="panels[1].name"
        [nzActive]="panels[1].active"
        [nzDisabled]="panels[1].disabled"
        [nzExtra]="videoExtra"
      >
        <div class="panel-content">
          <nz-alert nzType="info" nzMessage="Video Tutorials"
                    nzDescription="Watch instructional videos to learn how to use the system"
                    nzShowIcon></nz-alert>
          <div class="video-container">
            <iframe
              src="https://drive.google.com/file/d/1Qk-lwKfsFq0LdYaTzZy1Vu8qMia40lEc/preview"
              allow="autoplay"
              frameborder="0"
              allowfullscreen>
            </iframe>
          </div>
        </div>
        <ng-template #videoExtra>
          <span nz-icon [nzType]="panels[1].icon" nzTheme="outline"></span>
        </ng-template>
      </nz-collapse-panel>

      <!-- FAQs Panel -->
      <nz-collapse-panel
        [nzHeader]="panels[2].name"
        [nzActive]="panels[2].active"
        [nzDisabled]="panels[2].disabled"
        [nzExtra]="faqExtra"
      >
        <div class="panel-content">
          <nz-spin [nzSpinning]="isLoading">
            <!-- Search Bar -->
            <div class="search-bar">
              <nz-input-group [nzSuffix]="suffixIconSearch">
                <input
                  nz-input
                  placeholder="Search FAQs..."
                  [(ngModel)]="searchQuery"
                  (input)="filterFAQs()"
                />
              </nz-input-group>
              <ng-template #suffixIconSearch>
                <span nz-icon nzType="search"></span>
              </ng-template>
            </div>

            <!-- Error message -->
            <div *ngIf="errorMessage" class="error-message">
              <nz-alert nzType="error" [nzMessage]="errorMessage" nzShowIcon></nz-alert>
              <button nz-button nzType="primary" (click)="loadFAQs()" style="margin-top: 16px;">
                <span nz-icon nzType="reload"></span> Retry
              </button>
            </div>

            <!-- FAQs List -->
            <nz-collapse *ngIf="!isLoading && !errorMessage" nzAccordion>
              <nz-collapse-panel
                *ngFor="let faq of filteredFaqs"
                [nzHeader]="faq.faq_q"
              >
                <p>{{ faq.faq_a }}</p>
              </nz-collapse-panel>
            </nz-collapse>

            <!-- Empty state -->
            <div *ngIf="!isLoading && !errorMessage && filteredFaqs.length === 0" class="empty-state">
              <nz-empty
                [nzNotFoundContent]="searchQuery ? 'No matching FAQs found' : 'No FAQs available'"
              ></nz-empty>
            </div>
          </nz-spin>
        </div>
        <ng-template #faqExtra>
          <span nz-icon [nzType]="panels[2].icon" nzTheme="outline"></span>
        </ng-template>
      </nz-collapse-panel>
    </nz-collapse>
  </div>
</div>
