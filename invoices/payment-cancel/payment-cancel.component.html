<div nz-row [nzJustify]="'center'" style="margin-top: 50px; padding: 20px;">
  <div nz-col nzSpan="12">
    <nz-card>
      <div style="text-align: center;">
        <i nz-icon nzType="close-circle" nzTheme="outline" style="font-size: 48px; color: #ff4d4f;"></i>
        <h2>Payment Cancelled</h2>
        <p>Your payment was not completed. No charges have been made to your account.</p>
<!--
        <div *ngIf="invoiceId" style="margin: 20px 0;">
          <p>Invoice #{{invoiceId}}</p>
        </div> -->

        <div style="margin-top: 24px;">
          <button nz-button nzType="default" (click)="goToInvoices()" style="margin-right: 12px;">
            Return to Invoices
          </button>
          <!-- <button nz-button nzType="primary" (click)="retryPayment()" *ngIf="invoiceId">
            Retry Payment
          </button> -->
        </div>
      </div>
    </nz-card>
  </div>
</div>
