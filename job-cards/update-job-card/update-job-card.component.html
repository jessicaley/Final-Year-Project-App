<div class="form-container">
  <h2>Update Job Card #{{jobCardForm.value.job_card_id}}</h2>

  <form nz-form [formGroup]="jobCardForm" nzLayout="vertical">
    <nz-row [nzGutter]="24">
      <!-- Left Column - Job Card Details -->
      <nz-col nzSpan="12">
        <!-- Pattern Dropdown -->
        <nz-form-item>
          <nz-form-label >Pattern</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="pattern_id" nzPlaceHolder="Select pattern">
              <nz-option *ngFor="let pattern of patterns"
                [nzValue]="pattern.pattern_id"
                [nzLabel]="pattern.design">
              </nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>


        <!-- Special Instructions -->
        <nz-form-item>
          <nz-form-label>Special Instructions</nz-form-label>
          <nz-form-control>
            <textarea nz-input formControlName="special_instructions"
              placeholder="Any special instructions" rows="3"></textarea>
          </nz-form-control>
        </nz-form-item>
      </nz-col>

      <!-- Right Column - Materials and Artisans -->
      <nz-col nzSpan="12">
<!-- Materials Section -->
        <nz-form-item>
          <nz-form-label>Materials</nz-form-label>
          <nz-form-control>
            <div class="selection-container">
              <nz-select
                nzShowSearch
                nzPlaceHolder="Select material to add"
                [(ngModel)]="selectedMaterial"
                [ngModelOptions]="{standalone: true}"
                style="width: 100%">
                <!-- Use the same pattern as your other dropdowns -->
                <nz-option
                  *ngFor="let material of allMaterials"
                  [nzValue]="material"
                  [nzLabel]="material.material_name">
                </nz-option>
              </nz-select>

              <button
                nz-button
                nzType="primary"
                nzSize="small"
                [disabled]="!selectedMaterial"
                (click)="addMaterial(selectedMaterial); selectedMaterial = null">
                <span nz-icon nzType="plus"></span> Add
              </button>
            </div>

            <nz-list nzBordered class="assigned-list">
              <nz-list-header>
                <b>Assigned Materials</b>
              </nz-list-header>
              <nz-list-item *ngFor="let material of materials">
                {{ material.material_name }}
                <button nz-button nzType="link" nzDanger (click)="removeMaterial(material.material_id)">
                  <span nz-icon nzType="delete"></span>
                </button>
              </nz-list-item>
              <nz-list-item *ngIf="materials.length === 0">
                <span>No materials assigned</span>
              </nz-list-item>
            </nz-list>
          </nz-form-control>
        </nz-form-item>

        <!-- Artisans Section -->
        <nz-form-item>
          <nz-form-label>Artisans</nz-form-label>
          <nz-form-control>
            <div class="selection-container">
              <nz-select
                nzShowSearch
                nzPlaceHolder="Select artisan to add"
                [(ngModel)]="selectedArtisan"
                [ngModelOptions]="{standalone: true}"
                style="width: 100%">
                <!-- Use the same pattern as your other dropdowns -->
                <nz-option
                  *ngFor="let artisan of allArtisans"
                  [nzValue]="artisan"
                  [nzLabel]="artisan.name + ' ' + artisan.surname">
                </nz-option>
              </nz-select>

              <button
                nz-button
                nzType="primary"
                nzSize="small"
                [disabled]="!selectedArtisan"
                (click)="addArtisan(selectedArtisan); selectedArtisan = null">
                <span nz-icon nzType="plus"></span> Add
              </button>
            </div>

            <nz-list nzBordered class="assigned-list">
              <nz-list-header>
                <b>Assigned Artisans</b>
              </nz-list-header>
              <nz-list-item *ngFor="let artisan of artisans">
                {{ artisan.name }} {{ artisan.surname }}
                <button nz-button nzType="link" nzDanger (click)="removeArtisan(artisan.employee_id)">
                  <span nz-icon nzType="delete"></span>
                </button>
              </nz-list-item>
              <nz-list-item *ngIf="artisans.length === 0">
                <span>No artisans assigned</span>
              </nz-list-item>
            </nz-list>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>

    <!-- Form Actions -->
    <div class="form-actions">
      <button nz-button nzType="default" (click)="cancel()">Cancel</button>
      <button nz-button nzType="primary" (click)="submitForm()"
        [nzLoading]="isSubmitting"
        [disabled]="jobCardForm.invalid && jobCardForm.pristine">
        Update Job Card
      </button>
    </div>
  </form>
